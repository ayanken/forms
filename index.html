<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hebron - HTML Form Activity</title>
</head>

<body>

<h1>HTML Form</h1><br>

<form>

<fieldset>
<legend>Personal Information</legend>

<p>
<label for="name">Name:</label><br>
<input type="text" id="name" name="name">
</p>

<p>
<label for="email">Email:</label><br>
<input type="email" id="email" name="email">
</p>

</fieldset><br>

<fieldset>
<legend>Gender</legend><br>

<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label><br>

<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label><br>

<input type="radio" id="other" name="gender" value="other">
<label for="other">Other</label><br>

</fieldset><br>

<fieldset>
<legend>Hobbies</legend><br>

<input type="checkbox" id="reading" name="hobbies" value="reading">
<label for="reading">Reading</label><br>

<input type="checkbox" id="playing" name="hobbies" value="playing">
<label for="playing">playing</label><br>

<input type="checkbox" id="sports" name="hobbies" value="sports">
<label for="sports">Sports</label><br>

<input type="checkbox" id="singing" name="hobbies" value="singing">
<label for="singing">singing</label><br>

</fieldset><br>

<p>
<label for="comments">Additional Comments:</label><br>
<textarea id="comments" name="comments" rows="5" cols="30"></textarea>
</p>

<p>
<input type="submit" value="Submit">
</p>

</form>

</body>
</html>
